version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: paws_walks
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  django_web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DISPONIBILIDAD_SERVICE_URL: http://disponibilidad:5001
      ENV_TYPE: ASYNC
      DATABASE_URL: postgresql://user:password@db:5432/paws_walks
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      CELERY_BROKER_URL: redis://redis:6379/0
      ALIADO_API_URL: http://3.215.211.155/api/v1/sistema/estadisticas/
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
      - redis
    volumes:
      - ./db.sqlite3:/app/db.sqlite3

  celery_worker:
    build: .
    environment:
      ENV_TYPE: ASYNC
      DATABASE_URL: postgresql://user:password@db:5432/paws_walks
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A paws_walks worker --loglevel=info
    depends_on:
      - db
      - redis
    volumes:
      - ./db.sqlite3:/app/db.sqlite3

  disponibilidad:
    build: ./microservicio_disponibilidad
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/paws_walks
    depends_on:
      - db
    volumes:
      - ./db.sqlite3:/app/db.sqlite3

  flask_ratings:
    build: ./flask_ratings_service
    ports:
      - "5000:5000"
    depends_on:
      - db

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django_web
      - disponibilidad
      - flask_ratings
      - celery_worker

volumes:
  pgdata:
